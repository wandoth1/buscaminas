[package]
name = "buscaminas_v2_rust"
version = "2.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
macroquad = { version = "0.4.16", features = ["audio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
