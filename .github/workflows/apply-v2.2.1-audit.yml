name: Apply v2.2.1 audit fixes

on:
  push:
    branches: [ fix/v2.2.1-audit ]
    paths:
      - '.github/workflows/apply-v2.2.1-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.2.1-audit
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install Linux audio development library
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Apply audited fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # ---------------- engine.rs ----------------
          path = Path('src/engine.rs')
          text = path.read_text()

          def rep(old, new, count=1):
              global text
              if text.count(old) < count:
                  raise SystemExit(f"engine.rs: expected {count} occurrence(s) of {old[:100]!r}")
              text = text.replace(old, new, count)

          rep('    pub end_time: Option<f64>,\n    pub flags_count: usize,',
              '    pub end_time: Option<f64>,\n    pub paused_at: Option<f64>,\n    pub flags_count: usize,')
          rep('        let clamped_mines = total_mines.clamp(1, count.saturating_sub(1));',
              '        let clamped_mines = if count > 1 {\n            total_mines.clamp(1, count - 1)\n        } else {\n            0\n        };')
          rep('            end_time: None,\n            flags_count: 0,',
              '            end_time: None,\n            paused_at: None,\n            flags_count: 0,')
          rep('        self.total_mines = total_mines.clamp(1, count.saturating_sub(1));',
              '        self.total_mines = if count > 1 {\n            total_mines.clamp(1, count - 1)\n        } else {\n            0\n        };')
          rep('        self.end_time = None;\n        self.flags_count = 0;',
              '        self.end_time = None;\n        self.paused_at = None;\n        self.flags_count = 0;')
          rep('        if self.game_state == GameState::Won || self.game_state == GameState::Lost {\n            return RevealResult::None;\n        }\n\n        let idx = self.idx(r, c);\n        if self.grid[idx].state != CellState::Hidden {\n            return RevealResult::None;\n        }',
              '        if self.game_state == GameState::Won || self.game_state == GameState::Lost {\n            return RevealResult::None;\n        }\n        if r >= self.rows || c >= self.cols {\n            return RevealResult::None;\n        }\n\n        let idx = self.idx(r, c);\n        if !matches!(self.grid[idx].state, CellState::Hidden | CellState::Question) {\n            return RevealResult::None;\n        }')
          rep('            self.start_time = Some(now);\n        }',
              '            self.start_time = Some(now);\n            self.paused_at = None;\n        }')
          rep('        if self.game_state == GameState::Won || self.game_state == GameState::Lost {\n            return FlagAction::None;\n        }\n\n        let idx = self.idx(r, c);',
              '        if self.game_state == GameState::Won || self.game_state == GameState::Lost {\n            return FlagAction::None;\n        }\n        if r >= self.rows || c >= self.cols {\n            return FlagAction::None;\n        }\n\n        let idx = self.idx(r, c);')
          rep('        if self.game_state != GameState::Playing {\n            return RevealResult::None;\n        }\n\n        let idx = self.idx(r, c);',
              '        if self.game_state != GameState::Playing {\n            return RevealResult::None;\n        }\n        if r >= self.rows || c >= self.cols {\n            return RevealResult::None;\n        }\n\n        let idx = self.idx(r, c);')
          rep('    pub fn remaining_mines(&self) -> i32 {',
              '''    pub fn pause(&mut self, now: f64) {
        if self.game_state == GameState::Playing && self.paused_at.is_none() {
            self.paused_at = Some(now);
        }
    }

    pub fn resume(&mut self, now: f64) {
        if self.game_state != GameState::Playing {
            self.paused_at = None;
            return;
        }
        if let Some(paused_at) = self.paused_at.take() {
            if let Some(start_time) = &mut self.start_time {
                *start_time += (now - paused_at).max(0.0);
            }
        }
    }

    pub fn remaining_mines(&self) -> i32 {''')
          rep('                    ((now - st).max(0.0) as u32).min(999)',
              '                    let effective_now = self.paused_at.unwrap_or(now);\n                    ((effective_now - st).max(0.0) as u32).min(999)')
          path.write_text(text)

          # ---------------- main.rs ----------------
          path = Path('src/main.rs')
          text = path.read_text()

          def mrep(old, new, count=1):
              global text
              if text.count(old) < count:
                  raise SystemExit(f"main.rs: expected {count} occurrence(s) of {old[:100]!r}")
              text = text.replace(old, new, count)

          mrep('window_title: "Buscaminas v2 (Rust)".to_string(),',
               'window_title: "Buscaminas v2.2.1 (Rust)".to_string(),')
          mrep('        if dialog_active {\n            match draw_dialog',
               '        if dialog_active {\n            board.pause(now);\n            mouse_left_down = false;\n            mouse_right_down = false;\n            mouse_middle_down = false;\n            smiley_pressed = false;\n\n            match draw_dialog')
          mrep('                DialogEvent::SaveRecord(d_id, name, secs) => {\n                    highscores.add_score(&d_id, name, secs);\n                    dialog = DialogState::HighScores { tab: "principiante" };\n                }',
               '''                DialogEvent::SaveRecord(d_id, name, secs) => {
                    highscores.add_score(&d_id, name, secs);
                    let tab = match d_id.as_str() {
                        "intermedio" => "intermedio",
                        "experto" => "experto",
                        _ => "principiante",
                    };
                    dialog = DialogState::HighScores { tab };
                }''')
          mrep('            next_frame().await;\n            continue;\n        }\n\n        // Barra de Menús',
               '            next_frame().await;\n            continue;\n        }\n\n        board.resume(now);\n\n        // Barra de Menús')

          draw_call = '''        let menu_action = menu_bar.draw(
            screen_w,
            current_diff,
            board.allow_question,
            sound.enabled,
            particles_enabled,
        );'''
          draw_call_interactive = '''        let menu_was_open = menu_bar.active_menu.is_some();
        let menu_action = menu_bar.draw(
            screen_w,
            current_diff,
            board.allow_question,
            sound.enabled,
            particles_enabled,
            true,
        );'''
          mrep(draw_call, draw_call_interactive)
          mrep('                MenuAction::OpenRecords => {\n                    dialog = DialogState::HighScores { tab: "principiante" };\n                }',
               '''                MenuAction::OpenRecords => {
                    let tab = match current_diff {
                        Difficulty::Intermedio => "intermedio",
                        Difficulty::Experto => "experto",
                        _ => "principiante",
                    };
                    dialog = DialogState::HighScores { tab };
                }''')
          mrep('        let menu_open = menu_bar.active_menu.is_some();',
               '        let menu_open = menu_bar.active_menu.is_some();\n        let board_input_blocked = menu_was_open || menu_open;')
          if text.count('        if !menu_open {') != 2:
              raise SystemExit(f"main.rs: expected exactly 2 !menu_open guards, found {text.count('        if !menu_open {')}")
          text = text.replace('        if !menu_open {', '        if !board_input_blocked {')
          mrep('                    if cell.state == CellState::Hidden {',
               '                    if matches!(cell.state, CellState::Hidden | CellState::Question) {')
          mrep('                let is_pressed = (is_hovered && mouse_left_down && !mouse_right_down && cell.state == CellState::Hidden)',
               '                let is_pressed = (is_hovered && mouse_left_down && !mouse_right_down && matches!(cell.state, CellState::Hidden | CellState::Question))')

          second_draw = '''        menu_bar.draw(
            screen_w,
            current_diff,
            board.allow_question,
            sound.enabled,
            particles_enabled,
        );'''
          second_draw_inert = '''        menu_bar.draw(
            screen_w,
            current_diff,
            board.allow_question,
            sound.enabled,
            particles_enabled,
            false,
        );'''
          mrep(second_draw, second_draw_inert)
          path.write_text(text)

          # ---------------- ui.rs ----------------
          path = Path('src/ui.rs')
          text = path.read_text()
          old = '''        particles_enabled: bool,
    ) -> Option<MenuAction> {'''
          new = '''        particles_enabled: bool,
        interactive: bool,
    ) -> Option<MenuAction> {'''
          if old not in text:
              raise SystemExit('ui.rs: draw signature block not found')
          text = text.replace(old, new, 1)
          old = '        let raw_mouse_pressed = is_mouse_button_pressed(MouseButton::Left);\n        if !raw_mouse_pressed {'
          new = '        let raw_mouse_pressed = interactive && is_mouse_button_pressed(MouseButton::Left);\n        if interactive && !raw_mouse_pressed {'
          if old not in text:
              raise SystemExit('ui.rs: mouse press block not found')
          text = text.replace(old, new, 1)
          old = '            if is_hover && self.active_menu.is_some() && !is_open {'
          new = '            if interactive && is_hover && self.active_menu.is_some() && !is_open {'
          if old not in text:
              raise SystemExit('ui.rs: hover mutation block not found')
          text = text.replace(old, new, 1)
          text = text.replace('Buscaminas v2.2', 'Buscaminas v2.2.1')
          path.write_text(text)

          # ---------------- tests ----------------
          path = Path('tests/engine.rs')
          text = path.read_text()
          addition = r'''

#[test]
fn question_cell_can_be_revealed_directly() {
    let mut board = Board::new(3, 3, 1);
    let idx = board.idx(1, 1);
    board.grid[idx].state = CellState::Question;

    let result = board.reveal(1, 1, 1.0);

    assert!(!matches!(result, RevealResult::None | RevealResult::Mine(_, _)));
    assert_eq!(board.grid[idx].state, CellState::Revealed);
}

#[test]
fn one_by_one_board_is_safe_and_does_not_panic() {
    let mut board = Board::new(1, 1, 1);
    assert_eq!(board.total_mines, 0);
    assert!(matches!(board.reveal(0, 0, 1.0), RevealResult::Win(_)));
}

#[test]
fn out_of_bounds_actions_are_ignored() {
    let mut board = Board::new(9, 9, 10);
    assert_eq!(board.reveal(9, 0, 1.0), RevealResult::None);
    assert_eq!(board.toggle_flag(0, 9), FlagAction::None);

    let _ = board.reveal(0, 0, 2.0);
    assert_eq!(board.chord(99, 99, 3.0), RevealResult::None);
}

#[test]
fn paused_time_is_excluded_from_elapsed_seconds() {
    let mut board = Board::new(9, 9, 10);
    let _ = board.reveal(4, 4, 10.0);

    board.pause(15.0);
    assert_eq!(board.elapsed_seconds(25.0), 5);

    board.resume(30.0);
    assert_eq!(board.elapsed_seconds(35.0), 10);
}
'''
          if 'question_cell_can_be_revealed_directly' in text:
              raise SystemExit('tests already patched unexpectedly')
          path.write_text(text.rstrip() + addition + '\n')

          # ---------------- version metadata ----------------
          replace_once('Cargo.toml', 'version = "0.1.0"', 'version = "2.2.1"')
          replace_once('Cargo.lock', 'name = "buscaminas_v2_rust"\nversion = "0.1.0"',
                       'name = "buscaminas_v2_rust"\nversion = "2.2.1"')

          # ---------------- CI hardening ----------------
          path = Path('.github/workflows/build.yml')
          text = path.read_text()
          text = text.replace('      - name: Report formatting differences\n        continue-on-error: true\n        run: cargo fmt --all -- --check',
                              '      - name: Check formatting\n        run: cargo fmt --all -- --check')
          text = text.replace('        run: cargo clippy --locked --all-targets --all-features',
                              '        run: cargo clippy --locked --all-targets --all-features -- -D warnings')
          text = text.replace('<string>2.2.0</string>', '<string>2.2.1</string>')
          path.write_text(text)

          # ---------------- README ----------------
          path = Path('README.md')
          text = path.read_text()
          text = text.replace('# 🦀 Buscaminas v2.2 (Rust · Windows & macOS)',
                              '# 🦀 Buscaminas v2.2.1 (Rust · Windows & macOS)')
          text = text.replace('Las versiones compiladas se publican en **GitHub Releases**. Es preferible descargar desde allí en lugar de utilizar binarios almacenados dentro del árbol del repositorio.',
                              'Las versiones compiladas se publican exclusivamente en **GitHub Releases**; el repositorio mantiene sólo código fuente y recursos de construcción.')
          text = text.replace('\nEn Windows también se incluye `compilar_v2.bat` como acceso rápido.\n', '\n')
          text = text.replace('La CI comprueba compilación con el `Cargo.lock`, ejecuta Clippy y los tests, y además informa de diferencias de formato con `rustfmt`.',
                              'La CI comprueba compilación con el `Cargo.lock`, exige formato `rustfmt`, ejecuta Clippy con los warnings tratados como errores y ejecuta los tests.')
          path.write_text(text)
          PY

      - name: Remove stale tracked binaries
        run: rm -rf windows macos

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Check project
        run: cargo check --locked --all-targets --all-features

      - name: Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply audited v2.2.1 engine and UI corrections"
          git push origin HEAD:fix/v2.2.1-audit
