name: Apply v2.2.1 audit fixes

on:
  push:
    branches:
      - fix/v2.2.1-audit
    paths:
      - '.github/workflows/apply-v2.2.1-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.2.1-audit
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install Linux audio development library
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Apply deterministic patch
        run: python3 .github/scripts/apply_v2_2_1.py

      - name: Remove stale tracked binaries
        run: rm -rf windows macos

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Check project
        run: cargo check --locked --all-targets --all-features

      - name: Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply audited v2.2.1 engine and UI corrections"
          git push origin HEAD:fix/v2.2.1-audit
