name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Universal App & Binary)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build for Apple Silicon (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build for Intel (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary & macOS App Bundle
        run: |
          mkdir -p Buscaminas.app/Contents/MacOS
          mkdir -p Buscaminas.app/Contents/Resources

          # Combine into Universal binary
          lipo -create \
            target/aarch64-apple-darwin/release/buscaminas_v2_rust \
            target/x86_64-apple-darwin/release/buscaminas_v2_rust \
            -output Buscaminas.app/Contents/MacOS/buscaminas
          chmod +x Buscaminas.app/Contents/MacOS/buscaminas

          # Generate macOS .icns icon if icon.png exists
          if [ -f "icon.png" ]; then
            mkdir -p icon.iconset
            sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
            sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
            sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
            sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
            sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
            sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
            sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
            sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
            sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
            sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
            iconutil -c icns icon.iconset -o Buscaminas.app/Contents/Resources/AppIcon.icns
          fi

          # Create Info.plist
          cat << 'EOF' > Buscaminas.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>es</string>
              <key>CFBundleExecutable</key>
              <string>buscaminas</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.wandoth1.buscaminas</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Buscaminas</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Package as Zip
          zip -r -y Buscaminas-macOS-Universal.zip Buscaminas.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buscaminas-macOS-Universal
          path: Buscaminas-macOS-Universal.zip

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release
        run: cargo build --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\buscaminas_v2_rust.exe dist\Buscaminas_v2.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buscaminas-Windows
          path: dist\Buscaminas_v2.exe

  release:
    name: Publish Release Assets
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Buscaminas-macOS-Universal

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Buscaminas-Windows

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Buscaminas-macOS-Universal.zip
            Buscaminas_v2.exe
