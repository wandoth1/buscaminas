name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio development library
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Check project
        run: cargo check --locked --all-targets --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets --all-features

  build-macos:
    name: Build macOS (Universal App & Binary)
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Resolve version from Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(grep -m1 -E '^version = ' Cargo.toml | cut -d '"' -f 2 || true)"
          if [ -z "$cargo_version" ]; then
            echo "::error::No se pudo leer la version de Cargo.toml"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::La etiqueta v${tag_version} no coincide con Cargo.toml (${cargo_version})"
              exit 1
            fi
          fi
          echo "value=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "Version de la compilacion: ${cargo_version}"

      - name: Build for Apple Silicon (aarch64)
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: Build for Intel (x86_64)
        run: cargo build --locked --release --target x86_64-apple-darwin

      - name: Create Universal Binary & macOS App Bundle
        run: |
          set -euo pipefail
          mkdir -p Buscaminas.app/Contents/MacOS
          mkdir -p Buscaminas.app/Contents/Resources

          lipo -create \
            target/aarch64-apple-darwin/release/buscaminas_v2_rust \
            target/x86_64-apple-darwin/release/buscaminas_v2_rust \
            -output Buscaminas.app/Contents/MacOS/buscaminas
          chmod +x Buscaminas.app/Contents/MacOS/buscaminas

          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o Buscaminas.app/Contents/Resources/AppIcon.icns

          cat << 'EOF' > Buscaminas.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>es</string>
              <key>CFBundleExecutable</key>
              <string>buscaminas</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.wandoth1.buscaminas</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Buscaminas</string>
              <key>CFBundleDisplayName</key>
              <string>Buscaminas</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.value }}</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.value }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint Buscaminas.app/Contents/Info.plist
          lipo -info Buscaminas.app/Contents/MacOS/buscaminas
          codesign --force --deep --sign - Buscaminas.app
          codesign --verify --deep --strict --verbose=2 Buscaminas.app
          ditto -c -k --sequesterRsrc --keepParent Buscaminas.app Buscaminas-macOS-Universal.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buscaminas-macOS-Universal
          path: Buscaminas-macOS-Universal.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe)
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release
        run: cargo build --locked --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\buscaminas_v2_rust.exe dist\Buscaminas_v2.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buscaminas-Windows
          path: dist\Buscaminas_v2.exe
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
