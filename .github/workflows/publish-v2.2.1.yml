name: Publish v2.2.1 once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v2.2.1.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact from merged main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/windows
          gh run download 34690170801 --repo "$GITHUB_REPOSITORY" --name Buscaminas-Windows --dir release-assets/windows

      - name: Download macOS artifact from merged main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/macos
          gh run download 34690170801 --repo "$GITHUB_REPOSITORY" --name Buscaminas-macOS-Universal --dir release-assets/macos

      - name: Verify release files
        run: |
          test -f release-assets/windows/Buscaminas_v2.exe
          test -f release-assets/macos/Buscaminas-macOS-Universal.zip
          ls -lh release-assets/windows/Buscaminas_v2.exe release-assets/macos/Buscaminas-macOS-Universal.zip

      - name: Publish v2.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.1 \
            release-assets/windows/Buscaminas_v2.exe \
            release-assets/macos/Buscaminas-macOS-Universal.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target 481a1854be1aed75bfd9b59c98a31bbf941708d6 \
            --title "Buscaminas v2.2.1 (Windows & macOS Universal)" \
            --notes-file - <<'EOF'
          ## Buscaminas v2.2.1

          Versión de corrección posterior a la auditoría de v2.2.0.

          ### Correcciones
          - Las casillas marcadas con `?` pueden abrirse normalmente y ya no pueden bloquear una victoria.
          - El motor ignora coordenadas fuera de rango y soporta de forma segura tableros mínimos.
          - Los clics usados en menús ya no se filtran al tablero.
          - Los estados de ratón no quedan pegados al abrir diálogos.
          - La segunda pasada de la barra de menú es solo de render y no muta el menú por hover.
          - El cronómetro se pausa mientras hay diálogos abiertos.
          - La pantalla de récords abre la pestaña de la dificultad correspondiente.
          - Versiones internas y de la aplicación alineadas a 2.2.1.

          ### Calidad y distribución
          - 9 tests automáticos superados.
          - `cargo fmt --check` obligatorio.
          - Clippy se ejecuta con `-D warnings`.
          - Se eliminan del repositorio los binarios antiguos de `windows/` y `macos/`; las descargas se distribuyen únicamente mediante Releases.
          - Windows compilado en GitHub Actions.
          - macOS compilado como aplicación Universal para Apple Silicon e Intel y verificado con `codesign`.

          ### Descargas
          - Windows: `Buscaminas_v2.exe`
          - macOS: `Buscaminas-macOS-Universal.zip`

          Nota: la aplicación de macOS usa firma ad-hoc, no Developer ID/notarización de Apple. Gatekeeper puede pedir confirmación en la primera apertura.
          EOF
